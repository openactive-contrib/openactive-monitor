name: CI

on:
  pull_request:
    paths:
      - "jobs/ingest-opportunities/**"
      - "jobs/opportunity-insights/**"
      - "volume-1/data-analysis/**"
      - ".github/workflows/unit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.job }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: ingest-opportunities
            # Live-feed crawl tests are opt-in (RUN_NETWORK_TESTS=1) and stay off in CI.
            test-command: python -m unittest discover -s tests -t . -v
          - job: opportunity-insights
            test-command: python -m pytest tests -v
    defaults:
      run:
        working-directory: jobs/${{ matrix.job }}
    env:
      # Tests are offline: no GCP credentials or .env are available in CI.
      INGEST_BOUNDARY_DIR: ${{ github.workspace }}/volume-1/data-analysis
      INSIGHTS_GEO_DIR: ${{ github.workspace }}/volume-1/data-analysis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the python:3.13-slim base image in the Dockerfiles.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: jobs/${{ matrix.job }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: ${{ matrix.test-command }}
